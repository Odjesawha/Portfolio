<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Loading">
  <style>
    .ring{transform-origin:60px 60px;animation:spin 1.4s linear infinite}
    .ring2{transform-origin:60px 60px;animation:spin 2.2s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .dot{animation:pulse 1.1s ease-in-out infinite}
    .dot2{animation:pulse 1.1s ease-in-out .18s infinite}
    .dot3{animation:pulse 1.1s ease-in-out .36s infinite}
    @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  </style>
  <circle class="ring" cx="60" cy="60" r="46" fill="none" stroke="#8a4a31" stroke-width="3" stroke-linecap="round" stroke-dasharray="180 110"/>
  <circle class="ring2" cx="60" cy="60" r="36" fill="none" stroke="#8a4a31" stroke-opacity=".35" stroke-width="2" stroke-linecap="round" stroke-dasharray="60 160"/>
  <circle cx="60" cy="60" r="26" fill="#8a4a31"/>
  <text x="60" y="70" text-anchor="middle" font-family="Jost,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="1">VO</text>
  <g transform="translate(60 104)">
    <circle class="dot" cx="-14" cy="0" r="3" fill="#8a4a31"/>
    <circle class="dot2" cx="0" cy="0" r="3" fill="#8a4a31"/>
    <circle class="dot3" cx="14" cy="0" r="3" fill="#8a4a31"/>
  </g>
</svg>
