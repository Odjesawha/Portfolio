<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="TMA Brand Consulting logo cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2624"/>
      <stop offset="1" stop-color="#171413"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E56628" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#E56628" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="900" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="900" fill="url(#bg)"/>
    <circle cx="1105" cy="70" r="330" fill="#FFFFFF" opacity="0.055"/>
    <circle cx="90" cy="860" r="300" fill="#000000" opacity="0.10"/>
    <circle cx="600" cy="450" r="430" fill="url(#glow)"/>
    <rect x="26" y="26" width="1148" height="848" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

    <image x="290" y="300" width="620" height="300" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
  </g>
</svg>
